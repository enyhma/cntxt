# Runs semantic-release on every push to main: bumps extension/package.json
# per Conventional Commits, zips the built extension, tags, and publishes a
# GitHub Release with that zip attached. Chrome Web Store publishing is a
# manual last step — download the zip from the release and upload it in the
# Chrome Web Store developer dashboard (avoids the Google Cloud OAuth setup
# that API requires). The release commit includes "[skip ci]", which GitHub
# Actions honors natively, so it doesn't retrigger this workflow.
#
# GITHUB_TOKEN is provided automatically by Actions; no setup needed.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter ./extension compile
      - run: pnpm --filter ./extension test

      # semantic-release's zip step (see .releaserc.json) needs the
      # WXT_SUPABASE_* vars at build time. Map .env.production's unprefixed
      # values onto them, same as `just deploy-web` does for VITE_*.
      - run: |
          set -a
          source .env.production
          set +a
          export WXT_SUPABASE_URL="$SUPABASE_URL"
          export WXT_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
